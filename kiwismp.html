    var hasAllowedHost = parsedAssetUrl.hostname === proxyWorkerHost || parsedAssetUrl.hostname.endsWith("." + proxyWorkerHost);
    var hasAllowedPath = parsedAssetUrl.pathname.startsWith("/__l5e/documents/");
    if (!hasAllowedProtocol || !hasAllowedHost || !hasAllowedPath) {
      throw new Error("Invalid document URL");
    }
    assetUrl = parsedAssetUrl.toString();
      
    fetch(assetUrl)
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function(html) {
        // Inject <base> so relative URLs (./styles.css, ./image.png) resolve
        // against the original document path instead of the blob: URL.
        // This only modifies the in-memory copy used for the blob — the
        // original file in R2 is never changed.
        var basePath = assetUrl.substring(0, assetUrl.lastIndexOf("/") + 1);
        var baseTag = '<base href="' + basePath + '">';
        if (html.indexOf("<head") !== -1) {
          html = html.replace(/<head([^>]*)>/, "<head$1>" + baseTag);
        } else {
          html = baseTag + html;
        }
        var blob = new Blob([html], { type: "text/html" });
        var url = URL.createObjectURL(blob);
        var iframe = document.createElement("iframe");
        iframe.style.cssText = "width:100%;height:100vh;border:none;display:block;background:#fff;";
        iframe.setAttribute("sandbox", "allow-scripts allow-forms allow-modals");
        iframe.src = url;
        iframe.onload = show;
        iframe.onerror = function() { showError("Failed to load HTML file."); };
        container.appendChild(iframe);
      })
      .catch(function() { showError("Failed to load HTML file."); });
    } catch (e) {
      showError("An unexpected error occurred.");
    }
  })();
  </script>
